name: Release

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Existing draft release tag to receive the two installer EXE files
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      uploadToRelease: true
      releaseTag: ${{ inputs.releaseTag }}
    secrets: inherit
