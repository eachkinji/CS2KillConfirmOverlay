name: Release

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Optional release tag; blank uses the package version (for example v4.4.0.0)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      createDraftRelease: true
      releaseTag: ${{ inputs.releaseTag }}
    secrets: inherit
