# Sign every published GitHub release with keyless Sigstore (Fulcio + Rekor).
#
# Each release asset FILE gets a matching FILE.sig bundle (signature, Fulcio
# certificate, and Rekor entry) attached to the same release. The signing
# identity is the repository's own GitHub Actions OIDC token, so the Fulcio
# certificate is bound to:
#
#   https://github.com/eachkinji/CS2KillConfirmOverlay/.github/workflows/sigstore-sign.yml@refs/tags/*
#
# There are no secrets or private keys to manage. Verification instructions
# live in the README and in verify-release.ps1.
name: Sign release artifacts with Sigstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (default: latest release)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(gh release view --json tagName --jq '.tagName')"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${{ steps.resolve.outputs.tag }}" --dir assets --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign release assets with keyless Sigstore (Fulcio + Rekor)
        run: |
          set -euo pipefail
          cd assets
          signed=0
          for f in *.exe *.zip *.msix *.msixbundle *.appx *.appxbundle; do
            [ -f "$f" ] || continue
            echo "==> Signing $f"
            cosign sign-blob \
              --tlog-upload=true \
              --bundle "${f}.sig" \
              "$f"
            signed=$((signed + 1))
          done
          echo "Signed ${signed} artifact(s)"

      - name: Upload signatures to release
        run: |
          set -euo pipefail
          shopt -s nullglob
          sigs=(assets/*.sig)
          if [ ${#sigs[@]} -gt 0 ]; then
            gh release upload "${{ steps.resolve.outputs.tag }}" "${sigs[@]}" --clobber
          else
            echo "No signatures to upload."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
